<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0d22"/>
      <stop offset="100%" stop-color="#0d0810"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a7c0"/>
      <stop offset="50%" stop-color="#f9b97a"/>
      <stop offset="100%" stop-color="#c4a9f5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(244,167,192,0.15)" stroke-width="2"/>
  <!-- V letterform - thick, bold, centered -->
  <path d="M 120 140 L 256 380 L 392 140" 
        fill="none" 
        stroke="url(#vgrad)" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  <!-- Inner highlight line -->
  <path d="M 120 140 L 256 380 L 392 140" 
        fill="none" 
        stroke="rgba(255,255,255,0.18)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
